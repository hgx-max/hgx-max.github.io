<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HGX — 在线工具</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1c1c1c;
      --accent: #e8a838;
      --accent-dim: rgba(232, 168, 56, 0.12);
      --text-primary: #f2ede6;
      --text-secondary: #b5afa6;
      --text-muted: #6b6560;
      --border: rgba(255, 255, 255, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas",
                   "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                   system-ui, -apple-system, sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    ::selection { background: var(--accent); color: var(--bg); }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    a:hover { opacity: 0.75; }

    /* NAV */
    nav {
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nav-logo {
      font-family: Georgia, "Noto Serif SC", "STSong", serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }

    .nav-logo span { color: var(--accent); }

    /* MAIN */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 3rem 6rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .page-title {
      font-family: Georgia, "Noto Serif SC", "STSong", serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 0.8rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .page-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    /* Tools Grid */
    .tools-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .tool-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem 2.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.4s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
    }

    .tool-card:nth-child(1) { animation-delay: 0.35s; }
    .tool-card:nth-child(2) { animation-delay: 0.45s; }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.5s ease;
    }

    .tool-card:hover::before { width: 100%; }

    .tool-card:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translateY(-2px);
    }

    .tool-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 12px;
      background: rgba(232, 168, 56, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tool-icon::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 13px;
      border: 1px solid var(--accent);
      opacity: 0.1;
    }

    .tool-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-info { flex: 1; min-width: 0; }

    .tool-name {
      font-family: Georgia, "Noto Serif SC", "STSong", serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .tool-card:hover .tool-name { color: var(--accent); }

    .tool-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .tool-arrow {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: var(--text-muted);
    }

    .tool-card:hover .tool-arrow {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232, 168, 56, 0.06);
    }

    .tool-arrow svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer */
    footer {
      padding: 2rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .footer-left {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    .footer-right {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .footer-right span { color: var(--accent); }

    /* Corner Accent */
    .corner-accent {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      pointer-events: none;
    }

    .corner-accent::before {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 8px;
      height: 8px;
      background: var(--accent);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .page { padding: 3rem 1.5rem 4rem; }
      footer { padding: 1.5rem; flex-direction: column; gap: 0.8rem; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">H<span>.</span>G<span>.</span>X</div>
  </nav>

  <div class="page">
    <h1 class="page-title">在线工具</h1>
    <p class="page-desc">日常开发中常用的小工具，点击即可在新标签页打开</p>

    <div class="tools-grid">
      <a href="/tool/json.html" target="_blank" rel="noopener noreferrer" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 7c0-1 .8-2 2-2h1.2c.5 0 1-.2 1.4-.6l1.6-1.6c.4-.4 1-.6 1.6-.6h3.4c.6 0 1.2.2 1.6.6l1.6 1.6c.4.4.9.6 1.4.6H18c1.2 0 2 1 2 2v12c0 1.2-.8 2-2 2H6c-1.2 0-2-.8-2-2V7z"/>
            <path d="M8 13h8M8 17h5"/>
          </svg>
        </div>
        <div class="tool-info">
          <div class="tool-name">JSON 格式化</div>
          <div class="tool-desc">JSON 字符串格式化、压缩、校验，支持语法高亮与错误定位</div>
        </div>
        <div class="tool-arrow">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </a>

      <a href="/tool/pwd.html" target="_blank" rel="noopener noreferrer" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24">
            <path d="M6 10V7a6 6 0 0 1 12 0v3"/>
            <rect x="4" y="10" width="16" height="12" rx="2"/>
            <circle cx="12" cy="16" r="2"/>
          </svg>
        </div>
        <div class="tool-info">
          <div class="tool-name">密码生成器</div>
          <div class="tool-desc">安全随机密码批量生成，支持自定义长度、字符集与数量配置</div>
        </div>
        <div class="tool-arrow">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </div>
      </a>
    </div>
  </div>

  <footer>
    <div class="footer-left">© <script>document.write(new Date().getFullYear())</script> HGX. 保留所有权利.</div>
    <div class="footer-right">用 <span>♥</span> 和咖啡构建</div>
  </footer>

  <div class="corner-accent"></div>

</body>
</html>
