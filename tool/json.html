<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111318;
            --border: #1e2130;
            --accent: #e8a838;
            --accent-dim: rgba(232,168,56,0.12);
            --text-primary: #f2ede6;
            --text-secondary: #b5afa6;
            --text-muted: #6b6560;
            --hl-string: #98c379;
            --hl-number: #d19a66;
            --hl-bool: #56b6c2;
            --hl-null: #56b6c2;
            --hl-key: #61afef;
            --hl-bracket: #8892a6;
            --hl-colon: #8892a6;
            --hl-comma: #5c6370;
            --hl-error: #e06c75;
            --hl-error-line: rgba(224,108,117,0.08);
            --hl-error-marker: #e06c75;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: "SF Mono","Cascadia Code","Fira Code","Consolas",
                         "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        ::selection { background: var(--accent); color: var(--bg); }

        /* Top Bar */
        .top-bar {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: Georgia,serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            letter-spacing: 0.05em;
        }

        .logo span { color: var(--accent); }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        .page-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .back-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); opacity: 1; }

        /* Toolbar */
        .toolbar {
            padding: 12px 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        /* 统一按钮样式 */
        .btn {
            padding: 8px 18px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            border: 1px solid var(--accent);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-dim);
            color: var(--accent);
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 2px 12px rgba(232,168,56,0.2);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn svg {
            width: 14px; height: 14px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .toolbar-sep {
            width: 1px;
            height: 28px;
            background: var(--border);
            margin: 0 4px;
        }

        .status {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .status-dot.ok { background: #98c379; }
        .status-dot.err { background: var(--hl-error); }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            gap: 0;
            min-height: 0;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-right: 1px solid var(--border);
        }

        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel-head {
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-head .meta {
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text-dim,#3d3f4a);
            font-size: 10px;
        }

        /* Editor */
        .editor-wrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #rawJson {
            width: 100%;
            height: 100%;
            padding: 16px 20px 16px 60px;
            border: none;
            resize: none;
            font-family: 'Consolas','Monaco','Courier New',monospace;
            font-size: 14px;
            line-height: 1.7;
            background: var(--bg);
            color: var(--text-primary);
            outline: none;
            tab-size: 2;
            white-space: pre;
            overflow: auto;
        }

        .line-gutter {
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 100%;
            padding: 16px 8px 16px 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            font-family: 'Consolas','Monaco','Courier New',monospace;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-dim,#3d3f4a);
            text-align: right;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
        }

        /* Preview */
        .preview-content {
            flex: 1;
            overflow: auto;
            background: var(--bg);
            min-height: 0;
        }

        .code-block {
            padding: 16px 20px 16px 60px;
            position: relative;
            min-height: 100%;
        }

        .code-gutter {
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 100%;
            padding: 16px 8px 16px 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            font-family: 'Consolas','Monaco','Courier New',monospace;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-dim,#3d3f4a);
            text-align: right;
            user-select: none;
        }

        .code-content {
            font-family: 'Consolas','Monaco','Courier New',monospace;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre;
            tab-size: 2;
        }

        /* Syntax tokens */
        .tk-key { color: var(--hl-key); }
        .tk-str { color: var(--hl-string); }
        .tk-num { color: var(--hl-number); }
        .tk-bool { color: var(--hl-bool); }
        .tk-null { color: var(--hl-null); font-style: italic; }
        .tk-brace { color: var(--hl-bracket); }
        .tk-bracket { color: var(--hl-bracket); }
        .tk-colon { color: var(--hl-colon); }
        .tk-comma { color: var(--hl-comma); }

        .error-line-highlight {
            background: var(--hl-error-line);
            border-left: 3px solid var(--hl-error-marker);
            margin-left: -3px;
            display: inline-block;
            width: calc(100% + 3px);
        }

        /* Error box */
        .error-box {
            position: absolute;
            bottom: 16px;
            left: 60px;
            right: 16px;
            background: rgba(224,108,117,0.1);
            border: 1px solid rgba(224,108,117,0.3);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--hl-error);
            line-height: 1.5;
            display: none;
            z-index: 10;
        }

        .error-box.show { display: block; }

        .error-box .err-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .error-box .err-msg {
            opacity: 0.85;
            font-size: 12px;
        }

        .error-box .err-pos {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--surface);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 10px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 860px) {
            .main { flex-direction: column; }
            .editor-panel { border-right: none; border-bottom: 1px solid var(--border); }
            .toolbar { padding: 10px 1rem; }
            .panel-head { padding: 8px 1rem; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="logo">H<span>.</span>G<span>.</span>X</div>
            <div class="divider"></div>
            <div class="page-name">JSON 格式化工具</div>
        </div>
        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="btn" onclick="doFormat()" title="格式化 (Ctrl+Enter)">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h14"/></svg>
            格式化
        </button>
        <button class="btn" onclick="doCompress()" title="压缩为一行">
            <svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            压缩
        </button>
        <button class="btn" onclick="doValidate()" title="校验 JSON">
            <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
            校验
        </button>
        <div class="toolbar-sep"></div>
        <button class="btn" onclick="doCopy()" title="复制结果">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            复制
        </button>
        <button class="btn" onclick="doClear()" title="清空">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            清空
        </button>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">就绪</span>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="editor-panel">
            <div class="panel-head">
                <span>输入</span>
                <span class="meta" id="inputMeta">0 字符</span>
            </div>
            <div class="editor-wrap">
                <div class="line-gutter" id="lineGutter"></div>
                <textarea id="rawJson" spellcheck="false" placeholder='粘贴 JSON 字符串，例如：{"name":"张三","age":25}'></textarea>
                <div class="error-box" id="errorBox">
                    <div class="err-title">✕ 格式错误</div>
                    <div class="err-msg" id="errMsg"></div>
                    <div class="err-pos" id="errPos"></div>
                </div>
            </div>
        </div>

        <div class="preview-panel">
            <div class="panel-head">
                <span>预览</span>
                <span class="meta" id="outputMeta"></span>
            </div>
            <div class="preview-content" id="previewContent">
                <div class="code-block">
                    <div class="code-gutter" id="codeGutter"></div>
                    <div class="code-content" id="codeContent">
                        <span style="color:var(--text-dim)">等待格式化...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const rawJson     = document.getElementById('rawJson');
    const lineGutter  = document.getElementById('lineGutter');
    const codeContent = document.getElementById('codeContent');
    const codeGutter  = document.getElementById('codeGutter');
    const errorBox    = document.getElementById('errorBox');
    const errMsg      = document.getElementById('errMsg');
    const errPos      = document.getElementById('errPos');
    const statusDot   = document.getElementById('statusDot');
    const statusText  = document.getElementById('statusText');
    const inputMeta   = document.getElementById('inputMeta');
    const outputMeta  = document.getElementById('outputMeta');

    let lastResult = '';

    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._tid);
        t._tid = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function setStatus(ok, text) {
        statusDot.className = 'status-dot ' + (ok ? 'ok' : 'err');
        statusText.textContent = text;
    }

    function updateLineGutter() {
        const lines = rawJson.value.split('\n').length;
        lineGutter.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
    }

    function renderCodeGutter(lineCount) {
        codeGutter.innerHTML = Array.from({length: lineCount}, (_, i) => i + 1).join('<br>');
    }

    function syncGutterScroll() {
        lineGutter.style.transform = `translateY(-${rawJson.scrollTop}px)`;
    }

    rawJson.addEventListener('input', () => {
        updateLineGutter();
        inputMeta.textContent = rawJson.value.length + ' 字符';
        errorBox.classList.remove('show');
    });

    rawJson.addEventListener('scroll', syncGutterScroll);
    rawJson.addEventListener('keydown', syncGutterScroll);
    updateLineGutter();

    function parseJsonWithLocation(str) {
        try {
            return { ok: true, value: JSON.parse(str) };
        } catch (e) {
            const msg = e.message;
            let line = 1, col = 1;
            const posMatch = msg.match(/position\s+(\d+)/i);
            if (posMatch) {
                const pos = parseInt(posMatch[1]);
                const before = str.substring(0, pos);
                line = (before.match(/\n/g) || []).length + 1;
                col = pos - before.lastIndexOf('\n');
            }
            const lnMatch = msg.match(/line\s+(\d+)/i);
            const colMatch = msg.match(/column\s+(\d+)/i);
            if (lnMatch) line = parseInt(lnMatch[1]);
            if (colMatch) col = parseInt(colMatch[1]);
            return { ok: false, message: msg, line, col };
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function highlightRaw(json) {
        let result = '';
        let pos = 0;
        const len = json.length;

        while (pos < len) {
            const ch = json[pos];
            if (ch === '"') {
                let end = pos + 1;
                while (end < len) {
                    if (json[end] === '\\') { end += 2; continue; }
                    if (json[end] === '"') { end++; break; }
                    end++;
                }
                const raw = json.substring(pos, end);
                const isKey = (() => {
                    let j = end;
                    while (j < len && (json[j] === ' ' || json[j] === '\t' || json[j] === '\n' || json[j] === '\r')) j++;
                    return json[j] === ':';
                })();
                const v = escapeHtml(raw);
                result += isKey
                    ? '<span class="tk-key">' + v + '</span>'
                    : '<span class="tk-str">' + v + '</span>';
                pos = end;
            } else if (ch === '-' || (ch >= '0' && ch <= '9')) {
                let end = pos + 1;
                while (end < len && /[\d.eE\-+]/.test(json[end])) end++;
                result += '<span class="tk-num">' + escapeHtml(json.substring(pos, end)) + '</span>';
                pos = end;
            } else if (json.substring(pos, pos + 4) === 'true') {
                result += '<span class="tk-bool">true</span>';
                pos += 4;
            } else if (json.substring(pos, pos + 5) === 'false') {
                result += '<span class="tk-bool">false</span>';
                pos += 5;
            } else if (json.substring(pos, pos + 4) === 'null') {
                result += '<span class="tk-null">null</span>';
                pos += 4;
            } else if (ch === '{' || ch === '}') {
                result += '<span class="tk-brace">' + ch + '</span>';
                pos++;
            } else if (ch === '[' || ch === ']') {
                result += '<span class="tk-bracket">' + ch + '</span>';
                pos++;
            } else if (ch === ':') {
                result += '<span class="tk-colon">:</span>';
                pos++;
            } else if (ch === ',') {
                result += '<span class="tk-comma">,</span>';
                pos++;
            } else {
                result += escapeHtml(ch);
                pos++;
            }
        }
        return result;
    }

    function showError(msg, line, col) {
        const raw = rawJson.value;
        const lines = raw.split('\n');

        lineGutter.innerHTML = lines.map((_, i) => {
            const num = i + 1;
            return `<span${num === line ? ' style="color:var(--hl-error);font-weight:700"' : ''}>${num}</span>`;
        }).join('<br>');

        let highlighted = '';
        lines.forEach((l, i) => {
            const escaped = escapeHtml(l);
            if (i === line - 1) {
                highlighted += '<span class="error-line-highlight">' + escaped + '</span>';
            } else {
                highlighted += escaped;
            }
            if (i < lines.length - 1) highlighted += '\n';
        });

        codeContent.innerHTML = highlighted;
        codeGutter.innerHTML = lines.map((_, i) => {
            const num = i + 1;
            return `<span${num === line ? ' style="color:var(--hl-error);font-weight:700"' : ''}>${num}</span>`;
        }).join('<br>');

        errMsg.textContent = msg;
        errPos.textContent = '第 ' + line + ' 行，第 ' + col + ' 列';
        errorBox.classList.add('show');
        setStatus(false, '格式错误 · 行 ' + line + ' 列 ' + col);
    }

    function clearError() {
        errorBox.classList.remove('show');
    }

    function unwrapJson(obj) {
        while (typeof obj === 'string') {
            try { obj = JSON.parse(obj); } catch(e) { break; }
        }
        return obj;
    }

    function doFormat() {
        const raw = rawJson.value.trim();
        if (!raw) { toast('请先输入 JSON'); return; }
        clearError();
        const result = parseJsonWithLocation(raw);
        if (!result.ok) { showError(result.message, result.line, result.col); return; }

        const obj = unwrapJson(result.value);
        const formatted = JSON.stringify(obj, null, 4);
        codeContent.innerHTML = highlightRaw(formatted);
        renderCodeGutter(formatted.split('\n').length);
        lastResult = formatted;
        setStatus(true, '格式化完成');
        outputMeta.textContent = formatted.split('\n').length + ' 行 · ' + formatted.length + ' 字符';
        toast('格式化成功');
    }

    function doCompress() {
        const raw = rawJson.value.trim();
        if (!raw) { toast('请先输入 JSON'); return; }
        clearError();
        const result = parseJsonWithLocation(raw);
        if (!result.ok) { showError(result.message, result.line, result.col); return; }

        const obj = unwrapJson(result.value);
        const compressed = JSON.stringify(obj);
        codeContent.innerHTML = highlightRaw(compressed);
        renderCodeGutter(1);
        lastResult = compressed;
        setStatus(true, '压缩完成');
        outputMeta.textContent = '1 行 · ' + compressed.length + ' 字符';
        toast('压缩成功');
    }

    function doValidate() {
        const raw = rawJson.value.trim();
        if (!raw) { toast('请先输入 JSON'); return; }
        const result = parseJsonWithLocation(raw);
        if (!result.ok) { showError(result.message, result.line, result.col); toast('JSON 格式错误'); return; }
        clearError();

        const obj = unwrapJson(result.value);
        const type = Array.isArray(obj) ? '数组' : typeof obj === 'object' ? '对象' : typeof obj;
        let count = '';
        if (Array.isArray(obj)) count = obj.length + ' 个元素';
        else if (typeof obj === 'object' && obj !== null) count = Object.keys(obj).length + ' 个键';

        codeContent.innerHTML =
            '<span class="tk-bool">✓ JSON 格式正确</span>\n\n' +
            '<span class="tk-colon">类型：</span><span class="tk-str">' + type + '</span>\n' +
            '<span class="tk-colon">内容：</span><span class="tk-num">' + count + '</span>\n' +
            '<span class="tk-colon">大小：</span><span class="tk-num">' + raw.length + ' 字符</span>';
        codeGutter.innerHTML = '1<br>2<br>3<br>4<br>5';
        setStatus(true, '校验通过');
        outputMeta.textContent = type + ' · ' + count;
        toast('JSON 格式正确');
    }

    function doCopy() {
        if (!lastResult) { toast('暂无可复制的内容'); return; }
        navigator.clipboard.writeText(lastResult).then(() => toast('已复制到剪贴板'));
    }

    function doClear() {
        rawJson.value = '';
        codeContent.innerHTML = '<span style="color:var(--text-dim)">等待格式化...</span>';
        codeGutter.innerHTML = '';
        lineGutter.innerHTML = '';
        clearError();
        statusDot.className = 'status-dot';
        statusText.textContent = '就绪';
        inputMeta.textContent = '0 字符';
        outputMeta.textContent = '';
        lastResult = '';
        toast('已清空');
    }

    document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); doFormat(); }
    });

    rawJson.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const s = rawJson.selectionStart;
            const end = rawJson.selectionEnd;
            rawJson.value = rawJson.value.substring(0, s) + '  ' + rawJson.value.substring(end);
            rawJson.selectionStart = rawJson.selectionEnd = s + 2;
            updateLineGutter();
        }
    });
    </script>
</body>
</html>
