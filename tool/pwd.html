<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<style>
  :root {
    --bg: #08090c;
    --surface: #111318;
    --surface-hover: #181b24;
    --border: #1e2130;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.15);
    --accent-glow: rgba(0,229,160,0.06);
    --text-primary: #e8e6e1;
    --text-muted: #6b6e7b;
    --text-dim: #3d3f4a;
    --blue: #60a5fa;
    --yellow: #fbbf24;
    --pink: #f472b6;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 10% 90%, rgba(0,229,160,0.04) 0%, transparent 100%),
      radial-gradient(ellipse 40% 50% at 90% 10%, rgba(0,102,255,0.03) 0%, transparent 100%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
  }

  /* ===== 主布局 ===== */
  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 20px 28px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  .header-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .header-icon::after {
    content: '';
    position: absolute;
    inset: -1.5px;
    border-radius: 11.5px;
    border: 1px solid var(--accent);
    opacity: 0.12;
  }

  .header-icon svg {
    width: 18px; height: 18px;
    stroke: var(--accent); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .header-text h1 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-text p {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'Courier New', Consolas, monospace;
    letter-spacing: 0.3px;
  }

  /* 两栏主体 */
  .main {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 0 20px 20px;
    min-height: 0;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
    animation-delay: 0.06s;
  }

  /* ===== 左侧面板 ===== */
  .panel-left {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .card-title {
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
    font-family: 'Courier New', Consolas, monospace;
  }

  /* 长度 + 数量 */
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .field-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .length-val {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
    text-align: center;
    margin-bottom: 4px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-dim);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  .range-marks {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    padding: 0 2px;
  }

  .range-marks span {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 9px;
    color: var(--text-dim);
  }

  .count-input {
    width: 100%;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'Courier New', Consolas, monospace;
    font-size: 22px;
    font-weight: 500;
    text-align: center;
    outline: none;
    transition: all 0.2s;
  }

  .count-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .count-hint {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
  }

  /* 字符集列表 - 可滚动 */
  .charset-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: 4px;
  }

  .charset-scroll::-webkit-scrollbar { width: 4px; }
  .charset-scroll::-webkit-scrollbar-track { background: transparent; }
  .charset-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .charset-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .charset-item {
    border-radius: 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 9px 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .charset-item:hover {
    border-color: var(--text-dim);
    background: var(--surface-hover);
  }

  .charset-item.on {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .charset-head {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .chk-box {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .charset-item.on .chk-box,
  .custom-section.on .chk-box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .chk-box svg {
    width: 9px; height: 9px;
    stroke: var(--bg); fill: none;
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transform: scale(0.4);
    transition: all 0.15s;
  }

  .charset-item.on .chk-box svg,
  .custom-section.on .chk-box svg {
    opacity: 1;
    transform: scale(1);
  }

  .charset-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  .charset-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    flex-shrink: 0;
  }

  .charset-count {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 9px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    padding: 1px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .charset-reset {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    opacity: 0;
    pointer-events: none;
  }

  .charset-item.on .charset-reset {
    opacity: 1;
    pointer-events: auto;
  }

  .charset-reset:hover {
    color: var(--text-primary);
    border-color: var(--text-muted);
    background: var(--surface);
  }

  .charset-reset svg {
    width: 11px; height: 11px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .charset-chars {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s ease;
    margin-top: 0;
  }

  .charset-item.on .charset-chars {
    margin-top: 8px;
    grid-template-rows: 1fr;
  }

  .charset-chars-inner { overflow: hidden; }

  .charset-input {
    width: 100%;
    padding: 6px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: 'Courier New', Consolas, monospace;
    font-size: 11px;
    line-height: 1.4;
    outline: none;
    transition: all 0.2s;
    opacity: 0.35;
  }

  .charset-item.on .charset-input { opacity: 1; }

  .charset-item.on .charset-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  /* Custom */
  .custom-section {
    border-radius: 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 9px 12px;
    transition: all 0.2s;
    margin-top: 2px;
  }

  .custom-section.on {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .custom-toggle {
    display: flex; align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 0;
    transition: margin-bottom 0.25s;
  }

  .custom-section.on .custom-toggle { margin-bottom: 8px; }

  .custom-input-row {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s ease;
  }

  .custom-section.on .custom-input-row { grid-template-rows: 1fr; }

  .custom-input-inner { overflow: hidden; }

  .custom-input {
    width: 100%;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: 'Courier New', Consolas, monospace;
    font-size: 12px;
    outline: none;
    transition: all 0.2s;
    opacity: 0.35;
  }

  .custom-section.on .custom-input { opacity: 1; }

  .custom-section.on .custom-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  .custom-input::placeholder {
    color: var(--text-dim);
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 11px;
  }

  /* 生成按钮 */
  .btn-gen {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
    gap: 7px;
    flex-shrink: 0;
  }

  .btn-gen:hover {
    background: #00ffba;
    box-shadow: 0 4px 30px var(--accent-dim);
    letter-spacing: 1.2px;
  }

  .btn-gen:active { transform: scale(0.985); }

  .btn-gen svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ===== 右侧面板 ===== */
  .panel-right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .results-head {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
    flex-shrink: 0;
  }

  .results-left {
    display: flex; align-items: center;
    gap: 8px;
  }

  .results-title {
    font-size: 12px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Courier New', Consolas, monospace;
  }

  .count-badge {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 10px;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 500;
  }

  .strength-inline {
    display: flex; align-items: center;
    gap: 6px;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 10px;
  }

  .strength-inline .s-label {
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .strength-bar-mini {
    width: 48px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .strength-bar-mini-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease, background 0.4s ease;
    width: 0;
  }

  .strength-inline .s-text {
    font-weight: 500;
    transition: color 0.3s;
  }

  .btn-copy-all {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center;
    gap: 5px;
  }

  .btn-copy-all:hover {
    color: var(--text-primary);
    border-color: var(--text-muted);
  }

  .btn-copy-all.copied {
    color: var(--accent);
    border-color: var(--accent);
  }

  .btn-copy-all svg {
    width: 12px; height: 12px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* 结果列表 - 自动填满 */
  .result-list {
    flex: 1;
    overflow-y: auto;
    padding: 2px 0;
    min-height: 0;
  }

  .result-list::-webkit-scrollbar { width: 4px; }
  .result-list::-webkit-scrollbar-track { background: transparent; }
  .result-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .result-item {
    display: flex;
    align-items: center;
    padding: 9px 18px;
    gap: 12px;
    transition: background 0.15s;
    opacity: 0;
    animation: slideIn 0.3s ease forwards;
    position: relative;
  }

  .result-item::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 18px; right: 18px;
    height: 1px;
    background: var(--border);
  }

  .result-item:last-child::after { display: none; }

  .result-item:hover { background: var(--surface-hover); }

  .result-num {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 10px;
    color: var(--text-dim);
    width: 22px;
    flex-shrink: 0;
    text-align: right;
  }

  .result-pwd-wrap {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .result-pwd {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
    line-height: 1.5;
    cursor: text;
    user-select: all;
    white-space: nowrap;
    transform-origin: left center;
    display: inline-block;
    will-change: transform, font-size;
  }

  .result-pwd .c-num { color: var(--blue); }
  .result-pwd .c-low { color: var(--text-primary); }
  .result-pwd .c-up  { color: var(--yellow); }
  .result-pwd .c-sym { color: var(--accent); }
  .result-pwd .c-cus { color: var(--pink); }

  .btn-copy-one {
    width: 28px; height: 28px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    color: var(--text-dim);
  }

  .btn-copy-one:hover {
    color: var(--text-primary);
    border-color: var(--text-dim);
    background: var(--bg);
  }

  .btn-copy-one.done {
    color: var(--accent);
    border-color: var(--accent);
  }

  .btn-copy-one svg {
    width: 13px; height: 13px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .empty-hint {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ===== Toast - 更大更醒目 ===== */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-24px);
    background: linear-gradient(135deg, #111318 0%, #161922 100%);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 12px;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    box-shadow:
      0 8px 32px rgba(0, 229, 160, 0.2),
      0 2px 8px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    letter-spacing: 0.5px;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-4px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
    .main {
      flex-direction: column;
      overflow: visible;
    }
    .panel-left { width: 100%; }
    .panel-right { min-height: 400px; }
    .charset-scroll { max-height: none; overflow: visible; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M6 10V7a6 6 0 0 1 12 0v3"/><rect x="4" y="10" width="16" height="12" rx="2"/><circle cx="12" cy="16" r="2"/></svg>
    </div>
    <div class="header-text">
      <h1>密码生成器</h1>
      <p>// 安全随机 批量生成</p>
    </div>
  </div>

  <!-- 两栏主体 -->
  <div class="main">

    <!-- ===== 左侧：设置 ===== -->
    <div class="panel-left">

      <!-- 长度 + 数量 -->
      <div class="card">
        <div class="row-2">
          <div>
            <div class="field-label">密码长度</div>
            <div class="length-val" id="lengthVal">12</div>
            <input type="range" id="lengthSlider" min="4" max="64" value="12" oninput="onLengthChange(this.value)">
            <div class="range-marks">
              <span>4</span><span>16</span><span>32</span><span>64</span>
            </div>
          </div>
          <div>
            <div class="field-label">生成数量</div>
            <div style="margin-top:8px">
              <input type="number" class="count-input" id="countInput" value="10" min="1" max="200" oninput="onCountInput()">
            </div>
            <div class="count-hint">范围 1 ~ 200</div>
          </div>
        </div>
      </div>

      <!-- 字符集 -->
      <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden">
        <div class="card-title">字符集</div>
        <div class="charset-scroll">
          <div class="charset-list">

            <div class="charset-item on" data-key="upper">
              <div class="charset-head" onclick="toggleCharset(this.parentElement, event)">
                <div class="chk-box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
                <div class="charset-meta">
                  <span class="charset-label">大写字母</span>
                  <span class="charset-count" data-count="26">26</span>
                </div>
                <button class="charset-reset" title="恢复默认" onclick="resetCharset(this.closest('.charset-item'), event)">
                  <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 7.2 3.6"/><path d="M21 3v5h-5"/></svg>
                </button>
              </div>
              <div class="charset-chars" onclick="event.stopPropagation()">
                <div class="charset-chars-inner">
                  <input type="text" class="charset-input" value="ABCDEFGHIJKLMNOPQRSTUVWXYZ" oninput="onCharsetInput(this)">
                </div>
              </div>
            </div>

            <div class="charset-item on" data-key="lower">
              <div class="charset-head" onclick="toggleCharset(this.parentElement, event)">
                <div class="chk-box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
                <div class="charset-meta">
                  <span class="charset-label">小写字母</span>
                  <span class="charset-count" data-count="26">26</span>
                </div>
                <button class="charset-reset" title="恢复默认" onclick="resetCharset(this.closest('.charset-item'), event)">
                  <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 7.2 3.6"/><path d="M21 3v5h-5"/></svg>
                </button>
              </div>
              <div class="charset-chars" onclick="event.stopPropagation()">
                <div class="charset-chars-inner">
                  <input type="text" class="charset-input" value="abcdefghijklmnopqrstuvwxyz" oninput="onCharsetInput(this)">
                </div>
              </div>
            </div>

            <div class="charset-item on" data-key="number">
              <div class="charset-head" onclick="toggleCharset(this.parentElement, event)">
                <div class="chk-box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
                <div class="charset-meta">
                  <span class="charset-label">数字</span>
                  <span class="charset-count" data-count="10">10</span>
                </div>
                <button class="charset-reset" title="恢复默认" onclick="resetCharset(this.closest('.charset-item'), event)">
                  <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 7.2 3.6"/><path d="M21 3v5h-5"/></svg>
                </button>
              </div>
              <div class="charset-chars" onclick="event.stopPropagation()">
                <div class="charset-chars-inner">
                  <input type="text" class="charset-input" value="0123456789" oninput="onCharsetInput(this)">
                </div>
              </div>
            </div>

            <div class="charset-item on" data-key="special">
              <div class="charset-head" onclick="toggleCharset(this.parentElement, event)">
                <div class="chk-box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
                <div class="charset-meta">
                  <span class="charset-label">特殊字符</span>
                  <span class="charset-count" data-count="25">25</span>
                </div>
                <button class="charset-reset" title="恢复默认" onclick="resetCharset(this.closest('.charset-item'), event)">
                  <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 7.2 3.6"/><path d="M21 3v5h-5"/></svg>
                </button>
              </div>
              <div class="charset-chars" onclick="event.stopPropagation()">
                <div class="charset-chars-inner">
                  <input type="text" class="charset-input" value="!@#$%^&amp;*()_+-=[]{}|;:,.&lt;&gt;?" oninput="onCharsetInput(this)">
                </div>
              </div>
            </div>

            <!-- Custom -->
            <div class="custom-section" id="customSection">
              <div class="custom-toggle" onclick="toggleCustom()">
                <div class="chk-box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
                <div class="charset-meta">
                  <span class="charset-label">自定义字符</span>
                  <span class="charset-count" style="color:var(--text-dim)">自选</span>
                </div>
              </div>
              <div class="custom-input-row">
                <div class="custom-input-inner">
                  <input type="text" class="custom-input" id="customInput" placeholder="输入自定义字符" disabled>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- 生成按钮 -->
      <button class="btn-gen" onclick="generate()">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 7.2 3.6"/><path d="M21 3v5h-5"/><path d="M12 21a9 9 0 0 1-7.2-3.6"/><path d="M3 21v-5h5"/><circle cx="12" cy="12" r="1.5"/></svg>
        <span id="genBtnText">生成 10 个密码</span>
      </button>

    </div>

    <!-- ===== 右侧：结果 ===== -->
    <div class="panel-right">
      <div class="results-head">
        <div class="results-left">
          <span class="results-title">生成结果</span>
          <span class="count-badge" id="countBadge">×10</span>
          <div class="strength-inline">
            <span class="s-label">强度</span>
            <div class="strength-bar-mini"><div class="strength-bar-mini-fill" id="sFill"></div></div>
            <span class="s-text" id="sText">—</span>
          </div>
        </div>
        <button class="btn-copy-all" id="btnCopyAll" onclick="copyAll()">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="4" rx="1.5"/><path d="M5 6h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
          复制全部
        </button>
      </div>
      <div class="result-list" id="resultList">
        <div class="empty-hint">点击左侧按钮生成密码</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_CHARS = {
  upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower:   'abcdefghijklmnopqrstuvwxyz',
  number:  '0123456789',
  special: '!@#$%^&*()_+-=[]{}|;:,.<>?'
};

function decodeHtml(str) {
  const el = document.createElement('textarea');
  el.innerHTML = str;
  return el.value;
}

function initCharsets() {
  document.querySelectorAll('.charset-item').forEach(item => {
    const input = item.querySelector('.charset-input');
    if (input) {
      input.value = decodeHtml(input.value);
      updateCharsetCount(item);
    }
  });
}

const STRENGTH = [
  { min: 0,  text: '弱',   color: '#ff4d6a', w: '25%' },
  { min: 14, text: '中等', color: '#fbbf24', w: '50%' },
  { min: 22, text: '强',   color: '#60a5fa', w: '75%' },
  { min: 30, text: '极强', color: '#00e5a0', w: '100%' }
];

let passwords = [];
let customOn = false;

const ICONS = {
  copy:   '<rect x="8" y="5" width="12" height="14" rx="1.5"/><path d="M5 8h1.5a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>',
  copied: '<path d="M5 12l5 5L20 7"/>'
};

function secRand(n) {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

function getCount() {
  let v = parseInt(document.getElementById('countInput').value);
  if (isNaN(v) || v < 1) v = 1;
  if (v > 200) v = 200;
  return v;
}

function onCountInput() {
  const v = getCount();
  document.getElementById('genBtnText').textContent = '生成 ' + v + ' 个密码';
  document.getElementById('countBadge').textContent = '×' + v;
}

function toggleCharset(item, ev) {
  if (ev.target.closest('.charset-reset') || ev.target.closest('.charset-chars')) return;
  const total = document.querySelectorAll('.charset-item.on').length + (customOn ? 1 : 0);
  if (item.classList.contains('on') && total <= 1) {
    toast('至少需要选择一种字符类型');
    return;
  }
  item.classList.toggle('on');
}

function onCharsetInput(input) {
  updateCharsetCount(input.closest('.charset-item'));
}

function updateCharsetCount(item) {
  const input = item.querySelector('.charset-input');
  const countEl = item.querySelector('.charset-count');
  if (!input || !countEl) return;
  const unique = [...new Set(input.value)].join('');
  countEl.textContent = unique.length;
}

function resetCharset(item, ev) {
  ev.stopPropagation();
  const key = item.dataset.key;
  if (!key || !DEFAULT_CHARS[key]) return;
  const input = item.querySelector('.charset-input');
  input.value = DEFAULT_CHARS[key];
  updateCharsetCount(item);
  toast('已恢复默认');
}

function toggleCustom() {
  const section = document.getElementById('customSection');
  const input = document.getElementById('customInput');
  if (customOn) {
    const total = document.querySelectorAll('.charset-item.on').length;
    if (total <= 0) { toast('至少需要选择一种字符类型'); return; }
  }
  customOn = !customOn;
  section.classList.toggle('on', customOn);
  input.disabled = !customOn;
  if (customOn) setTimeout(() => input.focus(), 200);
}

function onLengthChange(v) {
  document.getElementById('lengthVal').textContent = v;
}

function getCharsets() {
  const list = [];
  document.querySelectorAll('.charset-item.on').forEach(item => {
    const input = item.querySelector('.charset-input');
    if (input) {
      const unique = [...new Set(input.value)].join('');
      if (unique.length > 0) list.push({ key: item.dataset.key, pool: unique });
    }
  });
  if (customOn) {
    const raw = document.getElementById('customInput').value.trim();
    if (raw) {
      const unique = [...new Set(raw)].join('');
      list.push({ key: 'custom', pool: unique });
    }
  }
  return list;
}

function refreshStrength() {
  const len = parseInt(document.getElementById('lengthSlider').value);
  const cs = getCharsets();
  const score = len + cs.length * 3;
  let level = STRENGTH[0];
  for (let i = STRENGTH.length - 1; i >= 0; i--) {
    if (score >= STRENGTH[i].min) { level = STRENGTH[i]; break; }
  }
  document.getElementById('sFill').style.width = level.w;
  document.getElementById('sFill').style.background = level.color;
  const sText = document.getElementById('sText');
  sText.textContent = cs.length > 0 ? level.text : '—';
  sText.style.color = cs.length > 0 ? level.color : 'var(--text-dim)';
}

function generate() {
  const len = parseInt(document.getElementById('lengthSlider').value);
  const count = getCount();
  const charsets = getCharsets();

  if (charsets.length === 0) { toast('请至少选择一种字符类型'); return; }
  if (len < charsets.length) {
    toast('密码长度不能少于已选类型数 (' + charsets.length + ')');
    return;
  }

  const allPool = charsets.map(c => c.pool).join('');
  passwords = [];

  for (let n = 0; n < count; n++) {
    const chars = [];
    charsets.forEach(cs => chars.push(cs.pool[secRand(cs.pool.length)]));
    while (chars.length < len) chars.push(allPool[secRand(allPool.length)]);
    for (let i = chars.length - 1; i > 0; i--) {
      const j = secRand(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    passwords.push(chars.join(''));
  }

  renderResults();
  refreshStrength();
  toast('已生成 ' + count + ' 个密码');
}

function getCharsetPool(key) {
  const item = document.querySelector('.charset-item[data-key="' + key + '"]');
  if (!item) return '';
  const input = item.querySelector('.charset-input');
  return input ? input.value : '';
}

function charClass(ch) {
  if (getCharsetPool('upper').includes(ch)) return 'c-up';
  if (getCharsetPool('lower').includes(ch)) return 'c-low';
  if (getCharsetPool('number').includes(ch)) return 'c-num';
  if (customOn) {
    const raw = document.getElementById('customInput').value.trim();
    if ([...new Set(raw)].includes(ch)) return 'c-cus';
  }
  if (getCharsetPool('special').includes(ch)) return 'c-sym';
  return 'c-sym';
}

function fitPasswordText(pwdEl) {
  const wrap = pwdEl.parentElement;
  const baseSize = 13;
  const minSize = 4;

  pwdEl.style.fontSize = baseSize + 'px';
  pwdEl.style.letterSpacing = '0.5px';
  pwdEl.style.transform = '';

  requestAnimationFrame(() => {
    const wrapW = wrap.clientWidth;
    const textW = pwdEl.scrollWidth;

    if (textW > wrapW && wrapW > 0) {
      const ratio = wrapW / textW;
      const newSize = Math.max(baseSize * ratio, minSize);
      pwdEl.style.fontSize = newSize + 'px';
      pwdEl.style.letterSpacing = (0.5 * ratio) + 'px';

      requestAnimationFrame(() => {
        const overflow = pwdEl.scrollWidth - wrapW;
        if (overflow > 0) {
          pwdEl.style.transform = 'scaleX(' + (wrapW / pwdEl.scrollWidth) + ')';
        }
      });
    }
  });
}

function renderResults() {
  const list = document.getElementById('resultList');
  list.innerHTML = '';

  passwords.forEach((pwd, i) => {
    const row = document.createElement('div');
    row.className = 'result-item';
    row.style.animationDelay = `${Math.min(i, 50) * 0.02}s`;

    const num = document.createElement('span');
    num.className = 'result-num';
    const padLen = String(passwords.length).length;
    num.textContent = String(i + 1).padStart(padLen, '0');

    const wrap = document.createElement('div');
    wrap.className = 'result-pwd-wrap';

    const pwdEl = document.createElement('span');
    pwdEl.className = 'result-pwd';
    for (const ch of pwd) {
      const s = document.createElement('span');
      s.className = charClass(ch);
      s.textContent = ch;
      pwdEl.appendChild(s);
    }
    wrap.appendChild(pwdEl);

    const btn = document.createElement('button');
    btn.className = 'btn-copy-one';
    btn.title = '复制';
    btn.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS.copy + '</svg>';
    btn.onclick = () => copySingle(i, btn);

    row.appendChild(num);
    row.appendChild(wrap);
    row.appendChild(btn);
    list.appendChild(row);

    setTimeout(() => fitPasswordText(pwdEl), 0);
  });
}

function copySingle(idx, btn) {
  if (!passwords[idx]) return;
  navigator.clipboard.writeText(passwords[idx]).then(() => {
    btn.classList.add('done');
    btn.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS.copied + '</svg>';
    toast('第 ' + (idx + 1) + ' 条已复制');
    setTimeout(() => {
      btn.classList.remove('done');
      btn.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS.copy + '</svg>';
    }, 1800);
  });
}

function copyAll() {
  if (passwords.length === 0) { toast('暂无可复制的密码'); return; }
  const padLen = String(passwords.length).length;
  const text = passwords.map((p, i) => String(i + 1).padStart(padLen, '0') + '. ' + p).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btnCopyAll');
    btn.classList.add('copied');
    const old = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS.copied + '</svg> 已复制';
    toast('全部 ' + passwords.length + ' 条已复制');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = old; }, 1800);
  });
}

window.addEventListener('resize', () => {
  document.querySelectorAll('.result-pwd').forEach(el => fitPasswordText(el));
});

document.getElementById('customInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});

initCharsets();
onCountInput();
</script>

</body>
</html>
